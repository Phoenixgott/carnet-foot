name: Outsiders – APK Android

# Compile l'APK signée de « Outsiders » à chaque push touchant l'app,
# puis la publie dans une GitHub Release (lien de téléchargement direct).
on:
  push:
    paths:
      - 'over15-methode/**'
      - '.github/workflows/over15-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: over15-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Construire et publier l'APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: over15-methode
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 3.0.${{ github.run_number }}
    steps:
      - name: Récupération du code
        uses: actions/checkout@v5

      - name: Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Dépendances
        run: npm install --no-audit --no-fund

      - name: Tests de la méthode
        run: npm test

      - name: Build web (TypeScript + Vite)
        run: npm run build
        env:
          APP_VERSION: ${{ env.VERSION_NAME }}

      - name: Projet Android (Capacitor) + icônes, splash, portrait, signature
        run: |
          test -d android || npx cap add android
          node scripts/preparer-android.mjs
          npx cap sync android

      - name: Clé de signature
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signature avec la clé des secrets GitHub."
          else
            echo "Signature avec la clé « sideload » du dépôt."
          fi

      - name: Compilation de l'APK signée (Gradle)
        working-directory: over15-methode/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Vérification de la signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | head -4
          "$BT/aapt2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|application-label:)" || true
          mkdir -p ../release
          cp "$APK" ../release/Outsiders.apk
          cp "$APK" "../release/Outsiders-v${VERSION_NAME}.apk"
          # Ancien nom gardé pour que l'ancien lien de téléchargement marche toujours.
          cp "$APK" ../release/Over15-Methode.apk
          ls -la ../release

      - name: Copie de l'APK (artefact du build)
        uses: actions/upload-artifact@v4
        with:
          name: Outsiders-v${{ env.VERSION_NAME }}
          path: release/Outsiders.apk
          retention-days: 30

      - name: Publication dans une GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="outsiders-v${VERSION_NAME}"
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          ## Outsiders v${VERSION_NAME}

          **Installer sur ton téléphone Android (Samsung) :**
          1. Touche **Outsiders.apk** ci-dessous pour la télécharger.
          2. Ouvre le fichier téléchargé (notification ou appli *Mes fichiers* → *Téléchargements*).
          3. Si Android le demande, autorise l'installation depuis ton navigateur (*Paramètres → Installer des applis inconnues*).
          4. Touche **Installer** (ou **Mettre à jour**). Tes données sont conservées d'une version à l'autre.

          Lien permanent vers la dernière version :
          https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/Outsiders.apk

          Android 8 ou plus récent · build ${GITHUB_SHA::7} · 18+ · Joueurs Info Service : 09 74 75 13 13
          NOTES
          gh release create "$TAG" release/Outsiders.apk "release/Outsiders-v${VERSION_NAME}.apk" release/Over15-Methode.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Outsiders v${VERSION_NAME}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest
          echo "APK : https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/Outsiders.apk" >> "$GITHUB_STEP_SUMMARY"
